name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (GUI tests skip without the [gui] extra)
        run: |
          python -m pytest tests/ --tb=short -q

      - name: Run mypy type check
        run: |
          python -m mypy image_splitter --ignore-missing-imports

      - name: Run ruff linter
        run: |
          ruff check image_splitter/ --ignore=E501

  gui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Tk + virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies (incl. GUI extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Run full suite under Xvfb
        run: |
          xvfb-run -a python -m pytest tests/ --tb=short -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Install wheel and smoke-test the console scripts
        run: |
          python -m venv /tmp/wheel_smoke
          /tmp/wheel_smoke/bin/pip install dist/*.whl
          /tmp/wheel_smoke/bin/image-splitter --preset-list
          /tmp/wheel_smoke/bin/python -c "import image_splitter; print(image_splitter.__version__)"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --tb=short -q \
            --cov=image_splitter --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
